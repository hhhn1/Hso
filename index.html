<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        .box { border: 1px solid #00ff41; padding: 25px; border-radius: 12px; box-shadow: 0 0 20px #00ff41; }
        h2 { text-shadow: 0 0 10px #00ff41; }
        input { background: #000; border: 1px solid #00ff41; color: #00ff41; width: 90%; padding: 12px; margin: 15px 0; border-radius: 5px; outline: none; }
        button { background: #00ff41; color: #000; border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 5px; transition: 0.3s; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="box">
        <h2>SHADOW CONTROL 👹</h2>
        <p>Target System IP:</p>
        <input type="text" id="target" placeholder="82.212.x.x">
        <button onclick="scan()">EXECUTE COMMAND</button>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        function scan() {
            const ip = document.getElementById('target').value;
            if(!ip) return alert("Target IP is required!");
            tg.sendData(JSON.stringify({ ip: ip }));
            tg.close();
        }
    </script>
</body>
</html>
