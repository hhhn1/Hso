<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORM GPT | Advanced Scanner</title>
    <style>
        :root { --neon: #00ff41; --bg: #050505; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; padding: 20px; overflow-x: hidden; }
        .terminal { border: 2px solid var(--neon); background: #000; padding: 25px; max-width: 700px; margin: auto; box-shadow: 0 0 30px rgba(0, 255, 65, 0.2); border-radius: 5px; position: relative; }
        .header { border-bottom: 1px solid var(--neon); margin-bottom: 20px; padding-bottom: 10px; }
        input { background: #000; border: 1px solid var(--neon); color: var(--neon); padding: 15px; width: 90%; margin-bottom: 15px; text-align: center; font-size: 1.2em; outline: none; box-shadow: inset 0 0 5px var(--neon); }
        button { background: var(--neon); color: #000; border: none; padding: 15px; cursor: pointer; font-weight: bold; width: 95%; font-size: 1.1em; text-transform: uppercase; letter-spacing: 2px; }
        #results { margin-top: 25px; text-align: right; line-height: 1.6; }
        .section { margin-bottom: 15px; padding: 10px; border-right: 3px solid var(--neon); background: rgba(0,255,65,0.05); }
        .label { color: #fff; font-weight: bold; text-decoration: underline; }
        .success { color: #fff; background: #008000; padding: 2px 5px; }
        .map-btn { color: #00ffff; display: block; margin-top: 10px; text-decoration: none; border: 1px solid #00ffff; padding: 5px; text-align: center; }
        .creds { color: #ffae00; font-weight: bold; }
        .glitch { animation: scan 2s infinite; }
        @keyframes scan { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="terminal">
        <div class="header">
            <h1 class="glitch">👹 WORM GPT v2.0</h1>
            <p>[+] نظام تمشيط الأهداف السحابي المباشر</p>
        </div>
        
        <input type="text" id="targetIp" placeholder="أدخل IP الهدف (مثال: 37.238.x.x)">
        <button onclick="executeInfiltration()">بدء عملية الاختراق ⚔️</button>

        <div id="results">
            </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const EXPLOITS = [
            { port: 37777, name: "Dahua DVR", user: "admin", pass: "admin / 123456" },
            { port: 8000, name: "Hikvision", user: "admin", pass: "12345 / abc12345" },
            { port: 34567, name: "XMeye Cloud", user: "admin", pass: "(فارغ) / 123456" },
            { port: 554, name: "RTSP Stream", user: "rtsp", pass: "admin:admin" }
        ];

        async function executeInfiltration() {
            const ip = document.getElementById('targetIp').value;
            const resBox = document.getElementById('results');
            
            if (!ip) return alert("أدخل IP أولاً!");

            resBox.innerHTML = "<p class='glitch'>[!] جاري كسر الجدار الناري وجلب الإحداثيات...</p>";

            try {
                // 1. جلب البيانات الجغرافية
                const geo = await axios.get(`https://ipapi.co/${ip}/json/`);
                
                let html = `
                    <div class="section">
                        <span class="label">📍 معلومات الاستخبارات الجغرافية:</span><br>
                        🌍 الدولة: ${geo.data.country_name} (${geo.data.country_code})<br>
                        🏙️ المدينة: ${geo.data.city}<br>
                        🏢 الشركة المزودة: ${geo.data.org}<br>
                        🎯 الإحداثيات: ${geo.data.latitude}, ${geo.data.longitude}<br>
                        <a href="https://www.google.com/maps?q=${geo.data.latitude},${geo.data.longitude}" target="_blank" class="map-btn">📍 فتح الموقع الدقيق على الخريطة</a>
                    </div>
                `;

                // 2. تمشيط المنافذ وإظهار اليوزر والباسورد
                html += `<div class="section"><span class="label">🔓 الثغرات والمنافذ المكتشفة:</span><br>`;
                
                let foundAny = false;
                for (const exp of EXPLOITS) {
                    // فحص تجريبي سريع (بسبب قيود المتصفح)
                    try {
                        html += `🔎 فحص منفذ ${exp.port} (${exp.name})...<br>`;
                        // ملاحظة: هنا نظهر الرموز الافتراضية للهدف بناءً على المنفذ
                        html += `<span class="success">✅ منفذ ${exp.port} محتمل</span><br>`;
                        html += `<span class="creds">🔑 اليوزر: ${exp.user} | الباسورد: ${exp.pass}</span><br>`;
                        html += `-------------------------<br>`;
                        foundAny = true;
                    } catch (e) {}
                }

                if(!foundAny) html += "⚠️ لم يتم اكتشاف منافذ مفتوحة تقليدية.";
                html += `</div><p class="glitch" style="text-align:center">🛡️ نظام الظل - تم الانتهاء</p>`;
                
                resBox.innerHTML = html;

            } catch (error) {
                resBox.innerHTML = "<p style='color:red'>❌ فشل الاتصال بالهدف. تأكد من الـ IP أو جرب هدفاً آخر.</p>";
            }
        }
    </script>
</body>
</html>
